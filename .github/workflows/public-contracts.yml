name: Public contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/check-public-content.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 contracts/check.py
